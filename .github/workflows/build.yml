name: Build

# Every push to main builds and tests the app, then makes downloadable
# versions for Windows, macOS and Linux (see the "Artifacts" box on the run page).
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Churchie.sln

      - name: Build
        run: dotnet build Churchie.sln -c Release --no-restore

      - name: Test
        run: dotnet test Churchie.sln -c Release --no-build --logger "console;verbosity=normal"

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows,               rid: win-x64,   os: windows-latest }
          - { name: Linux,                 rid: linux-x64, os: ubuntu-latest }
          - { name: macOS (Apple Silicon), rid: osx-arm64, os: macos-latest }
          - { name: macOS (Intel),         rid: osx-x64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # NSIS builds the Windows Setup.exe. GitHub's Windows machines usually have it already.
      - name: Make sure NSIS is installed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: Build the package
        shell: bash
        env:
          REQUIRE_INSTALLER: 1
        run: bash build/package.sh ${{ matrix.rid }} ${VERSION}

      - uses: actions/upload-artifact@v7
        with:
          name: Churchie-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
