# The Churchie website lives in website/ — plain HTML, CSS and JS, no build step.
[build]
  publish = "website"
  command = ""

# Pictures rarely change, so browsers may keep them for a week. The CSS and JS are left
# out on purpose: Netlify then makes browsers re-check them on each visit, so a style fix
# shows up straight away instead of up to a week later.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The app downloads (copied into website/downloads/ by the Mac's "Publish Website" launcher,
# never stored in git). "attachment" makes every browser save the file instead of trying
# to open it.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
